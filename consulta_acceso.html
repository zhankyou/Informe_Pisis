<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Accesos - ESE Municipal</title>
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { overflow-y: auto !important; height: 100% !important; }
        .main-content { overflow-y: auto !important; height: 100vh !important; padding-bottom: 100px !important; box-sizing: border-box; }

        .form-container { background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 1200px; margin: 20px auto 30px auto; color: #333; border-top: 6px solid #004b87; }
        .form-header { margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .form-header h2 { color: #004b87; font-size: 1.8rem; margin: 0; }

        .table-container { overflow-x: auto; margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        .admin-table th { background-color: #004b87; color: white; padding: 12px 15px; font-weight: 600; white-space: nowrap; }
        .admin-table td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; color: #4b5563; vertical-align: middle; }
        .admin-table tr:hover { background-color: #f8fafc; }

        .controls-wrapper { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .search-box:focus { border-color: #004b87; box-shadow: 0 0 0 3px rgba(0,75,135,0.1); }
        .btn-csv { padding: 12px 20px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-csv-all { background-color: #059669; }
        .btn-csv-all:hover { background-color: #047857; }
        .btn-csv-filtered { background-color: #3b82f6; }
        .btn-csv-filtered:hover { background-color: #2563eb; }

        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-delete:hover { background-color: #dc2626; transform: scale(1.05); }

        #loading-msg { text-align: center; font-size: 1.2rem; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <app-sidebar active-menu="consulta_acceso"></app-sidebar>
    <div class="main-content">
        <app-topbar titulo="Consulta de Autorizaciones"></app-topbar>

        <div id="adminPanel" class="form-container" style="display: none;">
            <div class="form-header">
                <h2><i class="fas fa-database"></i> Base de Datos: Solicitudes de Acceso</h2>
            </div>

            <div class="controls-wrapper">
                <input type="text" id="searchInput" class="search-box" onkeyup="filtrarTabla()" placeholder="Buscar por documento, nombre o correo...">
                <button onclick="exportarCSV(false)" class="btn-csv btn-csv-filtered"><i class="fas fa-filter"></i> Descargar Filtrado</button>
                <button onclick="exportarCSV(true)" class="btn-csv btn-csv-all"><i class="fas fa-download"></i> Descargar Todo</button>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Nombre Completo</th>
                            <th>Perfil / Sistema</th>
                            <th>Celular</th>
                            <th>Correo Electrónico</th>
                            <th>Territorio</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAccesosBody">
                        <tr><td colspan="7" id="loading-msg"><i class="fas fa-spinner fa-spin"></i> Cargando registros de forma segura...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/layout.js"></script>
    <script src="/static/js/rbac.js"></script>
    <script>
        let datosGlobalesAccesos = [];

        function validarYEjecutarSeguridad() {
            const rolRaw = sessionStorage.getItem('rol_usuario') || localStorage.getItem('rol_usuario') || sessionStorage.getItem('rol') || localStorage.getItem('rol') || '';
            const rolActual = rolRaw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

            const isAdmin = rolActual.includes('admin') || rolActual.includes('coordinador') || localStorage.getItem('isAdmin') === 'true' || sessionStorage.getItem('isAdmin') === 'true';

            if (!isAdmin) {
                alert("Acceso denegado: Se requieren privilegios administrativos.");
                window.location.href = "/";
                return;
            }
            document.getElementById('adminPanel').style.display = 'block';
            cargarDatosTabla();
        }

        async function cargarDatosTabla() {
            try {
                const res = await fetch('/api/listar_accesos');
                const json = await res.json();
                if (json.status === 'success') {
                    datosGlobalesAccesos = json.data;
                    renderizarTablaAccesos(datosGlobalesAccesos);
                } else {
                    throw new Error(json.message);
                }
            } catch (e) {
                document.getElementById('tablaAccesosBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Error cargando registros: ${e.message}</td></tr>`;
            }
        }

        function construirNombreReal(row) {
            if (row.nombre_completo && String(row.nombre_completo).trim() !== '') {
                return String(row.nombre_completo).trim();
            }
            const partes = [row.primer_nombre, row.segundo_nombre, row.primer_apellido, row.segundo_apellido];
            return partes.filter(p => p && String(p).trim() !== '').join(' ');
        }

        function renderizarTablaAccesos(data) {
            const tbody = document.getElementById('tablaAccesosBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #666;">No hay solicitudes que coincidan con la búsqueda.</td></tr>';
                return;
            }
            data.forEach(row => {
                const nomF = construirNombreReal(row) || 'N/A';
                const celular = row.celular || 'N/A';
                const perfil = row.perfil_profesional || row.sistema || 'N/A';

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold;">${row.numero_documento || 'N/A'}</td>
                        <td>${nomF}</td>
                        <td style="color: #004b87; font-weight: bold;">${perfil}</td>
                        <td>${celular}</td>
                        <td>${row.correo || 'N/A'}</td>
                        <td>${row.territorio || 'N/A'}</td>
                        <td style="text-align: center;">
                            <button onclick="eliminarRegistro(${row.id})" class="btn-delete" title="Eliminar Registro">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrarTabla() {
            const filtro = document.getElementById('searchInput').value.toLowerCase();
            const dataFiltrada = datosGlobalesAccesos.filter(row => {
                const doc = (row.numero_documento || '').toLowerCase();
                const nom = construirNombreReal(row).toLowerCase();
                const correo = (row.correo || '').toLowerCase();
                return doc.includes(filtro) || nom.includes(filtro) || correo.includes(filtro);
            });
            renderizarTablaAccesos(dataFiltrada);
        }

        async function eliminarRegistro(id) {
            if (!confirm("⚠️ ¿Está seguro de que desea eliminar permanentemente este registro? Esta acción no se puede deshacer.")) return;

            try {
                const res = await fetch(`/api/eliminar_acceso/${id}`, { method: 'DELETE' });
                const json = await res.json();

                if (res.ok && json.status === 'success') {
                    alert(json.message);
                    cargarDatosTabla();
                } else {
                    alert(json.message || "Error al eliminar el registro.");
                }
            } catch (e) {
                alert("Falla de red al intentar eliminar el registro.");
            }
        }

        function exportarCSV(descargarTodo) {
            let dataExport = datosGlobalesAccesos;
            if (!descargarTodo) {
                const filtro = document.getElementById('searchInput').value.toLowerCase();
                dataExport = datosGlobalesAccesos.filter(row => {
                    const doc = (row.numero_documento || '').toLowerCase();
                    const nom = construirNombreReal(row).toLowerCase();
                    const correo = (row.correo || '').toLowerCase();
                    return doc.includes(filtro) || nom.includes(filtro) || correo.includes(filtro);
                });
            }

            if (dataExport.length === 0) return alert("No hay datos para descargar.");

            const cabeceras = ["Documento", "Nombre Completo", "Perfil Profesional / Sistema", "Celular", "Correo", "Programa", "Territorio", "Microterritorio"];
            let csvContent = "\uFEFF" + cabeceras.join(";") + "\n";

            dataExport.forEach(row => {
                const nomF = construirNombreReal(row);
                const celular = row.celular || '';
                const perfil = row.perfil_profesional || row.sistema || '';

                const fila = [
                    row.numero_documento || '',
                    nomF,
                    perfil,
                    celular,
                    row.correo || '',
                    row.programa || '',
                    row.territorio || '',
                    row.microterritorio || ''
                ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(";");

                csvContent += fila + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", descargarTodo ? "Reporte_Accesos_Total.csv" : "Reporte_Accesos_Filtrado.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', validarYEjecutarSeguridad);
    </script>
</body>
</html>
