<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Autorizaciones - INFORME APS</title>
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { margin: 0; padding: 0; height: auto !important; min-height: 100vh; overflow-y: auto !important; background-color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; }
        .main-content { min-height: 100vh; padding-bottom: 50px; }
        .card { background: #ffffff; border-radius: 12px; padding: 24px; margin: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border-top: 5px solid #004b87; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group input { padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
        .form-group input:focus { border-color: #00b09b; outline: none; box-shadow: 0 0 0 3px rgba(0, 176, 155, 0.15); }
        .btn-action { background: #004b87; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-action:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-danger { background: #dc3545; }
        .btn-info { background: #0ea5e9; }
        .toolbar-table { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 15px 20px; padding: 15px 20px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .table-container { margin: 0 20px; overflow-x: auto; max-height: 600px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1000px; }
        th { background: #004b87; color: white; padding: 14px 12px; position: sticky; top: 0; z-index: 10; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid #f3f4f6; text-align: center; color: #4b5563; }
        tr:hover { background-color: #f0fdfa; }
        .alerta-dinamica { display: none; align-items: center; justify-content: space-between; padding: 16px 20px; margin-bottom: 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; }
        .alerta-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-left: 6px solid #dc2626; }
        .alerta-exito { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; border-left: 6px solid #059669; }
    </style>
</head>
<body>
    <app-sidebar active-menu="consulta_acceso"></app-sidebar>
    <div class="main-content">
        <app-topbar titulo="Consulta de Autorizaciones"></app-topbar>

        <div class="card">
            <h3 style="margin-top: 0; color: #004b87; font-size: 1.2rem; margin-bottom: 20px;"><i class="fas fa-search"></i> Filtros de Búsqueda</h3>
            <div id="alertaGlobal" class="alerta-dinamica">
                <span id="alertaMensaje"></span>
                <button onclick="cerrarAlerta()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:inherit;"><i class="fas fa-times"></i></button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <div class="form-group"><input type="text" id="filtroDoc" placeholder="Buscar por Documento..." oninput="filtrarTabla()"></div>
                <div class="form-group"><input type="text" id="filtroNombre" placeholder="Buscar por Nombre Completo..." oninput="filtrarTabla()"></div>
            </div>
        </div>

        <div class="toolbar-table">
            <div style="font-size: 0.9rem; color: #6b7280;"><strong id="lblTotalRegistros" style="color:#004b87;">0</strong> registros encontrados</div>
        </div>

        <div class="table-container">
            <table id="tablaAccesos">
                <thead>
                    <tr>
                        <th>Acciones</th>
                        <th>Fecha Solicitud</th>
                        <th>N° Documento</th>
                        <th>Nombre Completo</th>
                        <th>Perfil Profesional</th>
                        <th>Celular</th>
                        <th>Correo</th>
                    </tr>
                </thead>
                <tbody id="tbodyAccesos"></tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/layout.js"></script>
    <script>
        let datosGlobales = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
        });

        function getHeaders() {
            const token = sessionStorage.getItem('token') || localStorage.getItem('token');
            if (!token) {
                mostrarAlerta("Sesión expirada o token faltante. Redirigiendo al Login...", "error");
                setTimeout(() => window.location.href = '/login', 2000);
                throw new Error("No token");
            }
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alertaGlobal');
            const msjSpan = document.getElementById('alertaMensaje');
            alerta.className = `alerta-dinamica alerta-${tipo}`;
            msjSpan.innerHTML = `<i class="fas ${tipo === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${mensaje}`;
            alerta.style.display = 'flex';
            if (tipo === 'exito') setTimeout(cerrarAlerta, 5000);
        }

        function cerrarAlerta() {
            document.getElementById('alertaGlobal').style.display = 'none';
        }

        async function cargarDatos() {
            try {
                const res = await fetch('/api/listar_accesos', { method: 'GET', headers: getHeaders() });
                const data = await res.json();
                if (!res.ok || data.status === 'error') { mostrarAlerta(data.message || "Acceso denegado.", "error"); return; }
                datosGlobales = data.data || [];
                filtrarTabla();
            } catch (e) {
                if(e.message !== "No token") mostrarAlerta("Falla al cargar registros desde el servidor.", "error");
            }
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tbodyAccesos');
            tbody.innerHTML = '';

            const rolActual = String(sessionStorage.getItem('rol_usuario') || localStorage.getItem('rol_usuario')).toLowerCase();
            const esAdmin = rolActual.includes('admin') || rolActual.includes('coordinador');

            if(datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="padding:20px; color:#6b7280;">No se encontraron registros.</td></tr>`;
                return;
            }

            datos.forEach(d => {
                const nombreComp = d.nombre_completo || `${d.primer_nombre} ${d.primer_apellido}`;
                const btnDelete = esAdmin ? `<button title="Eliminar" onclick="eliminarRegistro(${d.id})" class="btn-action btn-danger"><i class="fas fa-trash-alt"></i></button>` : '';
                const btnEmail = esAdmin ? `<button title="Enviar Aval al Correo" onclick="enviarCorreoAval(${d.id})" class="btn-action" style="background:#10b981;"><i class="fas fa-envelope"></i></button>` : '';

                tbody.innerHTML += `
                    <tr>
                        <td style="white-space: nowrap;">
                            <button title="Descargar PDF" onclick='descargarPDF(${JSON.stringify(d).replace(/'/g, "&apos;")})' class="btn-action btn-info"><i class="fas fa-file-pdf"></i></button>
                            ${btnEmail}
                            ${btnDelete}
                        </td>
                        <td>${d.fecha_solicitud || 'N/A'}</td>
                        <td><strong>${d.numero_documento}</strong></td>
                        <td style="text-align: left;">${nombreComp}</td>
                        <td>${d.perfil_profesional || 'N/A'}</td>
                        <td>${d.celular || 'N/A'}</td>
                        <td>${d.correo || 'N/A'}</td>
                    </tr>
                `;
            });
        }

        function filtrarTabla() {
            const fDoc = document.getElementById('filtroDoc').value.trim().toLowerCase();
            const fNom = document.getElementById('filtroNombre').value.trim().toLowerCase();

            const filtrados = datosGlobales.filter(d => {
                const nombreComp = String(d.nombre_completo || `${d.primer_nombre} ${d.primer_apellido}`).toLowerCase();
                const doc = String(d.numero_documento || '').toLowerCase();
                return doc.includes(fDoc) && nombreComp.includes(fNom);
            });

            document.getElementById('lblTotalRegistros').innerText = filtrados.length;
            renderizarTabla(filtrados);
        }

        async function enviarCorreoAval(id) {
            cerrarAlerta();
            if(!confirm("¿Desea enviar el correo de Aval a este usuario?")) return;

            try {
                mostrarAlerta("Enviando correo, por favor espere...", "info"); // Estado de carga
                const res = await fetch(`/api/enviar_aval/${id}`, {
                    method: 'POST', headers: getHeaders()
                });
                const data = await res.json();

                if (!res.ok || data.status === 'error') { mostrarAlerta(data.message, 'error'); return; }
                mostrarAlerta(data.message, 'exito');
            } catch (e) {
                if(e.message !== "No token") mostrarAlerta("Falla al solicitar el envío de correo.", "error");
            }
        }

        async function eliminarRegistro(id) {
            cerrarAlerta();
            if(!confirm("¿Está seguro de eliminar esta solicitud de acceso de forma permanente?")) return;

            try {
                const res = await fetch(`/api/eliminar_acceso/${id}`, { method: 'DELETE', headers: getHeaders() });
                const data = await res.json();
                if (!res.ok || data.status === 'error') { mostrarAlerta(data.message, 'error'); return; }
                mostrarAlerta(data.message, 'exito');
                cargarDatos();
            } catch (e) {
                if(e.message !== "No token") mostrarAlerta("Falla al solicitar eliminación al servidor.", "error");
            }
        }

        async function descargarPDF(datosFila) {
            cerrarAlerta();
            try {
                const res = await fetch('/api/descargar_pdf_acceso', { method: 'POST', headers: getHeaders(), body: JSON.stringify(datosFila) });
                if (!res.ok) {
                    const data = await res.json();
                    mostrarAlerta(data.message || "Error al generar el PDF.", "error"); return;
                }
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Solicitud_Acceso_${datosFila.numero_documento}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                if(e.message !== "No token") mostrarAlerta("Falla al intentar descargar el PDF.", "error");
            }
        }
    </script>
</body>
</html>
