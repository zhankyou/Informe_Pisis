<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores de Componentes - INFORME APS</title>
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        html, body { overflow-y: auto !important; height: 100% !important; background-color: #f4f7f6; }
        .main-content { padding-bottom: 50px; }
        .toolbar { display: flex; gap: 15px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: 20px; align-items: flex-end; flex-wrap: wrap; border-top: 4px solid #00b09b; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: #004b87; margin-bottom: 5px; }
        .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; min-width: 200px; }
        .btn-action { background: #004b87; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 40px; transition: 0.2s; }
        .btn-action:hover { background: #003366; }
        .btn-action:disabled { background: #ccc; cursor: not-allowed; }
        .btn-info { background: #17a2b8; color: #fff; }
        .btn-info:hover { background: #117a8b; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; color: #fff; }

        .table-container { margin: 0 20px; overflow-x: auto; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-radius: 8px; border: 1px solid #e0e0e0; padding-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #004b87; color: white; padding: 15px 12px; text-align: center; border: 1px solid #003366; position: sticky; top: 0; z-index: 10; text-transform: uppercase; letter-spacing: 0.5px; }
        th:hover { z-index: 20; }
        td { padding: 12px 10px; border: 1px solid #e0e0e0; vertical-align: middle; }
        tr:hover { background-color: #f8fbff; }

        .td-center { text-align: center; }
        .td-justify { text-align: justify; line-height: 1.4; }

        .section-title { background: linear-gradient(90deg, #00b09b 0%, #007acc 100%); color: white !important; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; padding: 15px !important; border: none !important; }
        .section-title i { margin-right: 8px; color: #fffae6; }

        .input-num { width: 85px; padding: 8px 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; background: #fffae6; font-weight: bold; font-size: 0.9rem; position: relative; z-index: 1; }
        .input-num:disabled { background: #f0f0f0; border-color: #ddd; color: #888; }
        .input-num:focus { outline: 2px solid #00b09b; background: #fff; z-index: 2; }

        .input-obs { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; resize: vertical; }
        .input-obs:disabled { background: #f0f0f0; border-color: #ddd; color: #888; }

        .tooltip { position: relative; display: inline-block; cursor: help; margin-left: 5px; color: #ffcc00; }
        .tooltip .tooltiptext {
            visibility: hidden; width: 250px; background-color: #1a2840; color: #fff; text-align: center;
            border-radius: 6px; padding: 12px; position: absolute; z-index: 999999;
            top: 150%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s;
            font-size: 0.8rem; font-weight: 500; text-transform: none; letter-spacing: normal;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); line-height: 1.3;
        }
        .tooltip .tooltiptext::after {
            content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            border-width: 7px; border-style: solid; border-color: transparent transparent #1a2840 transparent;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <app-sidebar active-menu="indicadores_componentes"></app-sidebar>
    <div class="main-content">
        <app-topbar titulo="Indicadores de Componentes"></app-topbar>

        <div class="toolbar">
            <div class="form-group">
                <label>Mes de Reporte (Global)</label>
                <select id="selMes">
                    <option value="">Seleccione el mes...</option>
                    <option value="ENERO">Enero</option><option value="FEBRERO">Febrero</option>
                    <option value="MARZO">Marzo</option><option value="ABRIL">Abril</option>
                    <option value="MAYO">Mayo</option><option value="JUNIO">Junio</option>
                    <option value="JULIO">Julio</option><option value="AGOSTO">Agosto</option>
                    <option value="SEPTIEMBRE">Septiembre</option><option value="OCTUBRE">Octubre</option>
                    <option value="NOVIEMBRE">Noviembre</option><option value="DICIEMBRE">Diciembre</option>
                </select>
            </div>
            <button class="btn-action btn-info" onclick="cargarDatos()"><i class="fas fa-search"></i> Consultar</button>
            <button class="btn-action btn-danger" onclick="exportarPDF()"><i class="fas fa-file-pdf"></i> Descargar PDF</button>
            <button class="btn-action" onclick="habilitarEdicion()"><i class="fas fa-edit"></i> Habilitar Edición</button>
            <button class="btn-action btn-success" id="btnGuardar" onclick="guardarDatos()" disabled><i class="fas fa-save"></i> Guardar Cambios</button>
        </div>

        <div class="table-container">
            <table id="tablaIndicadores">
                <thead>
                    <tr>
                        <th width="3%">N°</th>
                        <th width="15%">INDICADOR</th>
                        <th width="22%">DESCRIPCIÓN DEL INDICADOR</th>
                        <th width="20%">FÓRMULA DE CÁLCULO</th>
                        <th width="12%">FUENTE DE VERIFICACIÓN</th>
                        <th width="6%">N <div class="tooltip"><i class="fas fa-info-circle"></i><span class="tooltiptext">Numerador / Valor Absoluto reportado.</span></div></th>
                        <th width="6%">D <div class="tooltip"><i class="fas fa-info-circle"></i><span class="tooltiptext">Denominador (Para los indicadores porcentuales).</span></div></th>
                        <th width="6%">%</th>
                        <th width="10%">OBSERVACIONES</th>
                    </tr>
                </thead>
                <tbody id="tbodyIndicadores"></tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/layout.js"></script>
    <script>
        let modoEdicion = false;

        document.addEventListener('DOMContentLoaded', () => {
            const rolActual = String(sessionStorage.getItem('rol_usuario') || localStorage.getItem('rol_usuario') || '').toLowerCase();
            // Restricción estricta para Coordinador / Administrador
            if (!rolActual.includes('admin') && !rolActual.includes('coordinador')) {
                alert("Acceso denegado. Este módulo es de uso exclusivo para Coordinadores y Administradores.");
                window.location.replace("/");
                return;
            }
            renderizarTabla();
        });

        const seccionesIndicadores = {
            1: "COMPONENTE POBLACIONAL MARCO PLAN DE CUIDADO PRIMARIO",
            2: "COMPONENTE DE GESTIÓN TÉCNICA",
            4: "COMPONENTE FINANCIERO"
        };

        const baseIndicadores = [
            ["Hogares atendidos por los equipos básicos de salud", "Este indicador evalúa el número de hogares atendidos por los equipos básicos de salud.", "Números de hogares atendidos por los equipos básicos de salud.", "SI APS"],
            ["Porcentaje de Equipos básicos de salud conformados", "Evalúa el numero de equipos básicos de salud conformados.", "Numerador: Número de equipos básicos de salud conformados. / Denominador: Número de equipos básicos asignados. X100", "PISIS"],
            ["Porcentaje de Territorios con operación de equipos básicos de salud", "Este indicador calcula el número de territorios identificados donde operan los equipos básicos de salud", "Numerador: Número de territorios donde operan los equipos básicos de salud. / Denominador: Número de territorios a intervenir X 100", "PISIS"],
            ["Ejecución de recursos", "Evalúa la ejecución de los recursos asignados para el desarrollo de los equipos básicos de salud dentro del marco normativo", "Numerador: Recursos ejecutados / Denominador: Recursos asignados x 100", "PISIS"],
            ["Porcentaje de rendimientos financieros", "Compara los rendimientos obtenidos con los recursos transferidos, el tiempo de ejecucion del recurso y resultado final de ejecución.", "Numerador: Rendimientos reintegrados. / Denominador: Rendimientos financieros generados X 100", "PISIS"]
        ];

        function renderizarTabla() {
            const tbody = document.getElementById('tbodyIndicadores');
            tbody.innerHTML = '';
            baseIndicadores.forEach((ind, idx) => {
                const id = idx + 1;

                if (seccionesIndicadores[id]) {
                    tbody.innerHTML += `
                        <tr>
                            <td colspan="9" class="section-title">
                                <i class="fas fa-layer-group"></i> ${seccionesIndicadores[id]}
                            </td>
                        </tr>
                    `;
                }

                // Bloqueo lógico del Denominador para el Indicador 1 (No es porcentual)
                const isAbsoluto = (id === 1);

                tbody.innerHTML += `
                    <tr>
                        <td class="td-center"><strong>${id}</strong></td>
                        <td class="td-justify"><strong style="color: #004b87;">${ind[0]}</strong></td>
                        <td class="td-justify" style="color: #444;">${ind[1]}</td>
                        <td class="td-justify" style="color: #17a2b8; font-family: monospace; font-size: 0.8rem; background: #f8fbff; padding: 10px;">${ind[2]}</td>
                        <td class="td-center" style="font-size:0.75rem; color: #666;">${ind[3]}</td>
                        <td class="td-center"><input type="number" id="num_${id}" class="input-num calc-input" disabled oninput="calcularPorcentaje(${id})"></td>
                        <td class="td-center"><input type="number" id="den_${id}" class="input-num calc-input" disabled oninput="calcularPorcentaje(${id})" ${isAbsoluto ? 'style="background:#f0f0f0;"' : ''}></td>
                        <td class="td-center" style="font-weight:bold; color:#d9534f; font-size: 1.1rem;" id="porc_${id}">${isAbsoluto ? 'N/A' : '0%'}</td>
                        <td class="td-center"><textarea id="obs_${id}" class="input-obs" rows="3" maxlength="500" disabled placeholder="Observaciones..."></textarea></td>
                    </tr>
                `;
            });
        }

        function calcularPorcentaje(id) {
            if (id === 1) {
                document.getElementById(`den_${id}`).value = '';
                return;
            }

            const num = parseFloat(document.getElementById(`num_${id}`).value) || 0;
            const den = parseFloat(document.getElementById(`den_${id}`).value) || 0;
            const porcField = document.getElementById(`porc_${id}`);

            if(den > 0) {
                const porc = ((num / den) * 100).toFixed(1);
                porcField.innerText = `${porc}%`;
                porcField.style.color = porc >= 80 ? '#28a745' : (porc >= 50 ? '#f59e0b' : '#d9534f');
            } else {
                porcField.innerText = '0%';
                porcField.style.color = '#d9534f';
            }
        }

        function habilitarEdicion() {
            const mes = document.getElementById('selMes').value;
            if(!mes) return alert("Seleccione el Mes antes de habilitar la edición.");

            modoEdicion = true;
            document.querySelectorAll('.calc-input, .input-obs').forEach(el => {
                if(el.id === 'den_1') return; // Se omite el denominador del Indicador 1 permanentemente
                el.disabled = false;
            });
            document.getElementById('btnGuardar').disabled = false;
        }

        async function cargarDatos() {
            const mes = document.getElementById('selMes').value;
            if(!mes) return alert("Seleccione un Mes para consultar la información.");

            renderizarTabla();
            modoEdicion = false;
            document.querySelectorAll('.calc-input, .input-obs').forEach(el => el.disabled = true);
            document.getElementById('btnGuardar').disabled = true;

            try {
                const res = await fetch(`/api/indicadores_componentes/datos?mes=${mes}`);
                const data = await res.json();
                if(data.status === 'success') {
                    data.data.forEach(row => {
                        const id = row.id_indicador;
                        if(document.getElementById(`num_${id}`)) {
                            document.getElementById(`num_${id}`).value = row.numerador || '';
                            if(id !== 1) document.getElementById(`den_${id}`).value = row.denominador || '';
                            document.getElementById(`obs_${id}`).value = row.observaciones || '';
                            calcularPorcentaje(id);
                        }
                    });
                }
            } catch (e) { console.error("Error cargando datos", e); }
        }

        async function guardarDatos() {
            if(!modoEdicion) return;
            const mes = document.getElementById('selMes').value;
            if(!mes) return alert("El Mes es obligatorio para guardar.");

            const payload = [];

            baseIndicadores.forEach((_, idx) => {
                const id = idx + 1;
                const num = parseFloat(document.getElementById(`num_${id}`).value) || null;
                const den = id === 1 ? null : (parseFloat(document.getElementById(`den_${id}`).value) || null);
                let porcVal = null;

                if(id !== 1) {
                    const porcText = document.getElementById(`porc_${id}`).innerText.replace('%','');
                    porcVal = porcText ? parseFloat(porcText) : null;
                }

                const obs = document.getElementById(`obs_${id}`).value.trim();
                payload.push({ id: id, num: num, den: den, porc: porcVal, obs: obs });
            });

            document.getElementById('btnGuardar').innerText = 'Guardando...';
            try {
                const res = await fetch('/api/indicadores_componentes/guardar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mes: mes, indicadores: payload })
                });
                const data = await res.json();
                alert(data.message);
            } catch (e) { alert("Error al guardar."); }
            document.getElementById('btnGuardar').innerHTML = '<i class="fas fa-save"></i> Guardar Cambios';
        }

        function exportarPDF() {
            const mes = document.getElementById('selMes').value || 'N/A';
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'pt', 'a4');

            doc.setFontSize(14);
            doc.text(`Reporte Global de Indicadores de Componentes`, 40, 30);
            doc.setFontSize(10);
            doc.text(`Mes Consolidado: ${mes}`, 40, 45);

            const headers = [['N°', 'INDICADOR', 'DESCRIPCIÓN DEL INDICADOR', 'FÓRMULA DE CÁLCULO', 'N', 'D', '%', 'OBSERVACIONES']];
            const data = [];

            baseIndicadores.forEach((ind, idx) => {
                const id = idx + 1;

                if (seccionesIndicadores[id]) {
                    data.push([{
                        content: seccionesIndicadores[id],
                        colSpan: 8,
                        styles: { halign: 'left', fillColor: [0, 176, 155], textColor: [255, 255, 255], fontStyle: 'bold' }
                    }]);
                }

                const n = document.getElementById(`num_${id}`) ? document.getElementById(`num_${id}`).value : '';
                const d = (id === 1) ? 'N/A' : (document.getElementById(`den_${id}`) ? document.getElementById(`den_${id}`).value : '');
                const porc = document.getElementById(`porc_${id}`) ? document.getElementById(`porc_${id}`).innerText : '0%';
                const obs = document.getElementById(`obs_${id}`) ? document.getElementById(`obs_${id}`).value : '';

                data.push([ id, ind[0], ind[1], ind[2], n, d, porc, obs ]);
            });

            doc.autoTable({
                startY: 55,
                head: headers,
                body: data,
                theme: 'grid',
                headStyles: { fillColor: [0, 75, 135], fontSize: 8, halign: 'center' },
                bodyStyles: { fontSize: 7, valign: 'middle' },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 20 },
                    1: { cellWidth: 120, fontStyle: 'bold' },
                    2: { cellWidth: 160 },
                    3: { cellWidth: 130 },
                    4: { halign: 'center', cellWidth: 40 },
                    5: { halign: 'center', cellWidth: 40 },
                    6: { halign: 'center', cellWidth: 40, fontStyle: 'bold' },
                    7: { cellWidth: 120 }
                },
                styles: { overflow: 'linebreak' }
            });

            doc.save(`Indicadores_Componentes_${mes}.pdf`);
        }
    </script>
</body>
</html>
